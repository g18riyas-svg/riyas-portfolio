[build]
  command = "npm run build"
  publish = ".next"
[build.environment]
  NODE_VERSION = "22"
[[plugins]]
  package = "@netlify/plugin-nextjs"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/profile/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
